name: Build Nokia browser
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download MIDP API stubs and ProGuard
        run: |
          mkdir -p lib build/classes
          M=https://repo1.maven.org/maven2/org/microemu
          curl -fL -o lib/cldc.jar $M/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar
          curl -fL -o lib/midp.jar $M/microemu-midp/2.0.4/microemu-midp-2.0.4.jar
          curl -fL -o pg.zip https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
          unzip -q pg.zip

      - name: Compile
        run: |
          javac -encoding UTF-8 -source 1.3 -target 1.3 \
            -classpath lib/cldc.jar:lib/midp.jar \
            -d build/classes src/*.java

      - name: Preverify and package
        run: |
          cat > MANIFEST.MF <<'EOF'
          MIDlet-1: Browser,,Browser
          MIDlet-Name: NokiaBrowser
          MIDlet-Vendor: me
          MIDlet-Version: 1.0
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.1
          EOF
          sed -i 's/^ *//' MANIFEST.MF
          cat > pg.cfg <<'EOF'
          -microedition
          -injars build/classes
          -outjars Browser.jar
          -libraryjars <java.home>/lib/rt.jar
          -libraryjars lib/midp.jar
          -dontobfuscate
          -dontoptimize
          -dontshrink
          -dontnote
          -dontwarn
          -keep public class Browser
          EOF
          sed -i 's/^ *//' pg.cfg
          java -jar proguard-7.4.2/lib/proguard.jar @pg.cfg
          jar umf MANIFEST.MF Browser.jar
          SIZE=$(stat -c%s Browser.jar)
          cp MANIFEST.MF Browser.jad
          echo "MIDlet-Jar-URL: Browser.jar" >> Browser.jad
          echo "MIDlet-Jar-Size: $SIZE" >> Browser.jad

      - uses: actions/upload-artifact@v4
        with:
          name: nokia-browser
          path: |
            Browser.jar
            Browser.jad
